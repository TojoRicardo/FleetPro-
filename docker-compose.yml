# Local development only. Copy .env.docker.example to .env.docker and set secrets.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fleetpro
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
      APP_KEY: ${APP_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-your_realtime_secret_here}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:9000/api/v1
      VITE_ENABLE_WS: "true"
      VITE_WS_URL: http://localhost:6001
    depends_on:
      - backend
      - realtime
    volumes:
      - ./frontend:/app
      - /app/node_modules

  billing-worker:
    build:
      context: ./billing-worker
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fleetpro
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
      INVOICE_CRON: "5 0 1 * *"
    depends_on:
      postgres:
        condition: service_healthy

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      PORT: 6001
      CORS_ORIGIN: http://localhost:5173
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-your_realtime_secret_here}

  billing-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_postgres_password_here}@postgres:5432/fleetpro?schema=public
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
